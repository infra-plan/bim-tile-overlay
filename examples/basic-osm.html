<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bim-tile-overlay - Basic OSM Example</title>
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css">
    <style>
        body { margin: 0; overflow: hidden; }
        #viewer { width: 100vw; height: 100vh; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(255,255,255,0.95);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        #controls label { cursor: pointer; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div id="controls">
        <label>
            <input type="checkbox" id="toggle-osm">
            Show OpenStreetMap tiles
        </label>
    </div>

    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
    <!-- Import map tells the browser how to resolve bare 'proj4' import -->
    <script type="importmap">
    {
        "imports": {
            "proj4": "https://cdn.jsdelivr.net/npm/proj4@2.20.3/+esm"
        }
    }
    </script>

    <!--
        NOTE: In a real project you would use a bundler (Vite, Webpack, etc.)
        and import from the npm package:
            import { TileOverlay, CoordinateTransformer } from 'bim-tile-overlay';

        This example uses import maps for simplicity so it works without a bundler.
    -->
    <script type="module">
        // Import library modules directly for this example
        import { TileOverlay } from '../src/tile-overlay.js';
        import { CoordinateTransformer } from '../src/coordinate-transformer.js';

        // ── Configuration ────────────────────────────────────────────
        // Replace these with your own values:
        const ACCESS_TOKEN = 'YOUR_ACCESS_TOKEN';
        const MODEL_URN = 'YOUR_MODEL_URN';

        // proj4 definition for your local CRS.
        // This example uses Croatia HTRS96/TM (EPSG:3765).
        // Find yours at https://epsg.io/
        const LOCAL_CRS = '+proj=tmerc +lat_0=0 +lon_0=16.5 +k=0.9999 +x_0=500000 +y_0=0 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs';

        // ── Initialize Viewer ────────────────────────────────────────
        const viewerDiv = document.getElementById('viewer');
        const options = {
            env: 'AutodeskProduction2',
            api: 'streamingV2',
            getAccessToken: (callback) => callback(ACCESS_TOKEN, 3600),
        };

        Autodesk.Viewing.Initializer(options, () => {
            const viewer = new Autodesk.Viewing.GuiViewer3D(viewerDiv);
            viewer.start();

            Autodesk.Viewing.Document.load(
                `urn:${MODEL_URN}`,
                (doc) => {
                    const viewable = doc.getRoot().getDefaultGeometry();
                    viewer.loadDocumentNode(doc, viewable).then(() => {
                        // ── Set up tile overlay ──────────────────
                        const transformer = CoordinateTransformer.fromAPSViewer(viewer, LOCAL_CRS);

                        // Expand model bounds by 10x for OSM coverage
                        const modelBounds = transformer.getModelBoundsLL84();
                        const lonSpan = modelBounds.east - modelBounds.west;
                        const latSpan = modelBounds.north - modelBounds.south;
                        const maxBounds = {
                            west: modelBounds.west - lonSpan * 10,
                            south: modelBounds.south - latSpan * 10,
                            east: modelBounds.east + lonSpan * 10,
                            north: modelBounds.north + latSpan * 10,
                        };

                        const overlay = new TileOverlay(viewer, transformer, {
                            urlTemplate: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                            zoomRange: [14, 17],
                            maxBounds,
                        });

                        // Toggle overlay with checkbox
                        document.getElementById('toggle-osm').addEventListener('change', (e) => {
                            if (e.target.checked) {
                                overlay.enable();
                            } else {
                                overlay.disable();
                            }
                        });
                    });
                },
                (code, message) => console.error('Document load failed:', code, message)
            );
        });
    </script>
</body>
</html>
